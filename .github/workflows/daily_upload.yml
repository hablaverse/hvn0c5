name: Spanish Learning Bot - Daily Upload (5x per day)

on:
  schedule:
    # Run 5 times daily for GLOBAL COVERAGE
    # Timezone conversions:
    # 00:00 UTC = 7:00 PM EST (North America evening)
    # 06:00 UTC = 1:00 AM EST / 7:00 AM CET (Europe morning)
    # 12:00 UTC = 7:00 AM EST / 1:00 PM CET (Europe lunch)
    # 18:00 UTC = 1:00 PM EST / 7:00 PM CET (Europe evening)
    # 20:00 UTC = 3:00 PM EST / 9:00 PM CET (Prime time)
    #
    # This covers:
    # - Latin America (Mexico: UTC-6, Argentina: UTC-3)
    # - Europe (Spain: UTC+1, UK: UTC+0)
    # - North America (EST: UTC-5, PST: UTC-8)
    - cron: '0 0,6,12,18,20 * * *'

  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize content history
        run: |
          if [ ! -f "content_history.json" ]; then
            echo '{"runs": [], "used_phrases": []}' > content_history.json
            echo "📝 Created new content history file"
          else
            echo "✅ Loaded existing content history"
            phrase_count=$(python -c "import json; print(len(json.load(open('content_history.json'))['used_phrases']))")
            echo "📊 History contains $phrase_count phrases"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (including fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          echo "✅ Fonts installed: DejaVu Sans"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          echo "POLLINATIONS_API_KEY=${{ secrets.POLLINATIONS_API_KEY }}" >> .env
          echo "FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}" >> .env
          echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env
          echo "INSTAGRAM_ACCOUNT_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}" >> .env
          echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env
          echo "TWITTER_API_KEY=${{ secrets.TWITTER_API_KEY }}" >> .env
          echo "TWITTER_API_SECRET=${{ secrets.TWITTER_API_SECRET }}" >> .env
          echo "TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}" >> .env
          echo "TWITTER_ACCESS_SECRET=${{ secrets.TWITTER_ACCESS_SECRET }}" >> .env
          echo "VK_ACCESS_TOKEN=${{ secrets.VK_ACCESS_TOKEN }}" >> .env
          echo "VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env

      - name: Run Spanish Learning Bot
        run: |
          python main.py

      - name: Commit updated content history to repository
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add content_history.json
          if ! git diff --staged --quiet; then
            git commit -m "📊 Update content history - Run #${{ github.run_number }}"
            git push
            echo "✅ Content history committed - NO repeats across runs!"
          else
            echo "ℹ️ No changes to commit"
          fi

