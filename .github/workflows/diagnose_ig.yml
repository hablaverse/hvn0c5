name: Diagnose Instagram Account
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Instagram Account
        run: |
          echo "=== Instagram Account ID ==="
          echo "IG_ID=${{ secrets.INSTAGRAM_ACCOUNT_ID }}"
          TOKEN="${{ secrets.INSTAGRAM_ACCESS_TOKEN }}"
          echo "Token (first 20): ${TOKEN:0:20}..."
          # Query Facebook Page for connected Instagram
          PAGE_INFO=$(curl -s "https://graph.facebook.com/v21.0/me?fields=id,name,instagram_business_account{id,username}&access_token=$TOKEN")
          echo "Page Info: $PAGE_INFO"
