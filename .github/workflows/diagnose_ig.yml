name: Get Instagram Handle
on:
  workflow_dispatch:

jobs:
  get_handle:
    runs-on: ubuntu-latest
    steps:
      - name: Query Instagram Account
        run: |
          TOKEN="${{ secrets.INSTAGRAM_ACCESS_TOKEN }}"
          IG_ID="${{ secrets.INSTAGRAM_ACCOUNT_ID }}"
          echo "=== Looking up Instagram ID: $(echo $IG_ID | base64) ==="
          # Query the Instagram Business Account directly
          IG_INFO=$(curl -s "https://graph.facebook.com/v21.0/$IG_ID?fields=id,username,name,followers_count,media_count&access_token=$TOKEN")
          echo "IG_INFO (base64): $(echo $IG_INFO | base64)"
          # Also try fetching connected page info
          PAGE_INFO=$(curl -s "https://graph.facebook.com/v21.0/me?fields=id,name&access_token=$TOKEN")
          echo "PAGE_INFO (base64): $(echo $PAGE_INFO | base64)"
          # Try the connected_instagram_account field
          CONNECTED=$(curl -s "https://graph.facebook.com/v21.0/me?fields=instagram_business_account&access_token=$TOKEN")
          echo "CONNECTED (base64): $(echo $CONNECTED | base64)"
